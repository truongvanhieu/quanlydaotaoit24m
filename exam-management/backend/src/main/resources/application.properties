server.port=5000

# SQL Server local development. start-backend.ps1 automatically discovers the
# listening SQL Server TCP port and sets EXAM_DB_JDBC_URL for this process.
# For a custom server, set EXAM_DB_JDBC_URL, EXAM_DB_USER, EXAM_DB_PASSWORD.
spring.datasource.url=${EXAM_DB_JDBC_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=exam_management;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${EXAM_DB_USER:sa}
spring.datasource.password=${EXAM_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
