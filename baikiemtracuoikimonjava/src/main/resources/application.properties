spring.application.name=QuanLyDaoTao
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=quan_ly_dao_tao;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.security.user.name=admin
spring.security.user.roles=ADMIN
