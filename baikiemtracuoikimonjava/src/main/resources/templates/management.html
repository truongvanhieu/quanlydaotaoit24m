<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' | EduManage'">Quản lý | EduManage</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body th:attr="data-page=${pageKey}">
	<div class="app-shell">
		<div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>
		<main class="main-content">
			<div th:replace="~{fragments/topbar :: topbar(${pageTitle})}"></div>
			<section class="page-body">
				<div id="management-root"></div>
			</section>
		</main>
	</div>
	<div th:replace="~{fragments/login-modal :: loginModal}"></div>
	<div id="toast-area" class="toast-container position-fixed top-0 end-0 p-3"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/api.js}"></script>
	<script th:src="@{/js/management.js}"></script>
</body>
</html>
