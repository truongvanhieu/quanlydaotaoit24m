<header th:fragment="topbar(title)" class="topbar">
	<div>
		<p class="eyebrow">HỆ THỐNG QUẢN LÝ ĐÀO TẠO</p>
		<h1 th:text="${title}">Tổng quan</h1>
	</div>
	<div class="topbar-actions">
		<span class="user-badge" id="user-badge"><span class="status-dot"></span> Chưa đăng nhập</span>
		<button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#login-modal">
			Đăng nhập quản trị
		</button>
		<button class="btn btn-light" id="logout-button" type="button" hidden>Đăng xuất</button>
	</div>
</header>
