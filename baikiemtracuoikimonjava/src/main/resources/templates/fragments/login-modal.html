<div th:fragment="loginModal" class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="login-title" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<form class="modal-content" id="login-form">
			<div class="modal-header">
				<div>
					<p class="eyebrow mb-1">QUYỀN GHI DỮ LIỆU</p>
					<h2 class="modal-title fs-5" id="login-title">Đăng nhập quản trị</h2>
				</div>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
			</div>
			<div class="modal-body">
				<p class="text-secondary small">Mật khẩu quản trị được hiển thị trong Terminal khi Spring Boot khởi động, trừ khi bạn tự cấu hình biến môi trường.</p>
				<div class="mb-3">
					<label class="form-label" for="login-username">Tài khoản</label>
					<input class="form-control" id="login-username" value="admin" required autocomplete="username">
				</div>
				<div>
					<label class="form-label" for="login-password">Mật khẩu</label>
					<input class="form-control" id="login-password" type="password" required autocomplete="current-password">
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-light" type="button" data-bs-dismiss="modal">Hủy</button>
				<button class="btn btn-primary" type="submit">Lưu phiên đăng nhập</button>
			</div>
		</form>
	</div>
</div>
