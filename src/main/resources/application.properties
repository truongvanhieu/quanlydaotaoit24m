spring.application.name=quanlydaotao

# Cấu hình kết nối (Tự động nhận diện Driver)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=it24m;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123123}

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Port
server.port=${PORT:8080}