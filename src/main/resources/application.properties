spring.application.name=quanlydaotao

# Cấu hình Cổng (Render sẽ cấp biến PORT, chạy ở máy local sẽ tự dùng 8080)
server.port=${PORT:8080}

# Cấu hình SQL Server (Ưu tiên lấy biến môi trường từ Render, nếu không có sẽ tự dùng cấu hình Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=QuanLyDaoTao;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true