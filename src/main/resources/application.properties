
spring.application.name=quanlydaotao

# SQL Server - thong tin ket noi lay tu environment variables
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=it24m;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema do file SQL chung quan ly
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Render PORT mac dinh 10000, local mac dinh 8080
server.port=${PORT:8080}
server.address=0.0.0.0

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
