spring.application.name=quanlydaotao

# SQL Server: do not commit a real database password to Git.
# Default URL works when SQL Server listens on TCP port 1433.
# For a named SQL Express instance, set DB_URL in the shell before running.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=it24m;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The shared project manages its schema in SQL Server scripts.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# API documentation (provided by springdoc-openapi 3.x for Spring Boot 4).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
