<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N6 - Đăng ký học phần</title>
<style>body{font:15px system-ui,sans-serif;background:#f3f6fb;margin:0;color:#19283b}header{background:#15345c;color:white;padding:22px 5%}main{max-width:1100px;margin:auto;padding:20px}section{background:white;padding:18px;margin:16px 0;border-radius:12px;box-shadow:0 1px 8px #b8c4d133}h2{margin:0 0 12px}input,select,button,textarea{padding:9px;margin:4px;max-width:100%;border:1px solid #b6c6d9;border-radius:6px}button{background:#1464c0;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #e5e9ef}th{background:#eef3fa}#message{white-space:pre-wrap}.grid{display:flex;flex-wrap:wrap;gap:8px}.grid>*{flex:1;min-width:170px}</style></head><body>
<header><h1>Nhóm 6 — Đăng ký học phần / học lại</h1><p>Bản thử nghiệm nội bộ: chỉ sử dụng dữ liệu demo; API chưa có xác thực, phân quyền.</p></header><main><p id="message" role="status"></p>
<section><h2>Đợt đăng ký</h2><form id="periodForm"><div class="grid"><input name="name" placeholder="Tên đợt" required><select name="semesterId" id="semesters" required></select><label>Bắt đầu<input name="startTime" type="datetime-local" required></label><label>Kết thúc<input name="endTime" type="datetime-local" required></label><input name="minCredits" type="number" value="12" min="0" max="255" title="Tín chỉ tối thiểu"><input name="maxCredits" type="number" value="25" min="0" max="255" title="Tín chỉ tối đa"></div><label><input type="checkbox" name="allowRetake" checked> Cho học lại</label><label><input type="checkbox" name="active" checked> Mở thủ công</label><button>Tạo đợt</button></form><div id="periods"></div></section>
<section><h2>Đăng ký lớp học phần</h2><form id="registerForm"><div class="grid"><select id="students" name="studentId" required></select><select id="classes" name="courseClassId" required></select><select id="regPeriods" name="registrationPeriodId" required></select><select name="registrationType"><option value="1">Học mới</option><option value="2">Học lại</option><option value="3">Cải thiện</option></select></div><button>Gửi đăng ký</button></form><div id="registrations"></div></section>
<section><h2>Môn tương đương</h2><form id="equivForm"><div class="grid"><select id="original" name="originalCourseId" required></select><select id="equivalent" name="equivalentCourseId" required></select><select name="equivalenceType"><option value="1">Thay thế hoàn toàn</option><option value="2">Tương đương song song</option></select><input name="effectDate" type="date"><input name="note" placeholder="Ghi chú"></div><label><input type="checkbox" name="active" checked> Hiệu lực</label><button>Tạo tương đương</button></form><div id="equivalences"></div></section></main>
<script>
const api='/api/n6';
const $=id=>document.getElementById(id);
const msg=s=>$('message').textContent=s;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){let r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...options.headers}});if(!r.ok){let err=await r.text();throw Error(r.status+': '+err)}return r.status===204?null:r.json()}
function choices(id,rows,label){$(id).replaceChildren();for(let r of rows){let o=document.createElement('option');o.value=r.id;o.textContent=label(r);$(id).append(o)}}
function table(id,rows,keys){$(id).innerHTML=rows.length?'<table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p>Chưa có dữ liệu</p>'}
async function load(){try{let [p,r,e,sem,cc,co,st]=await Promise.all(['/periods','/registrations','/equivalences','/semesters','/classes','/courses','/students'].map(x=>request(x)));table('periods',p,['name','semesterId','startTime','endTime','active']);table('registrations',r,['studentId','courseClassId','registrationType','status','paid']);table('equivalences',e,['originalCourseId','equivalentCourseId','equivalenceType','active']);choices('semesters',sem,x=>x.name||x.code);choices('regPeriods',p,x=>x.name);choices('classes',cc,x=>x.class_code);choices('students',st,x=>x.code+' — '+x.full_name);choices('original',co,x=>x.code+' — '+x.name);choices('equivalent',co,x=>x.code+' — '+x.name)}catch(e){msg('Lỗi: '+e.message)}}
function attach(form,path,convert){$(form).addEventListener('submit',async ev=>{ev.preventDefault();let f=new FormData(ev.target);let o=Object.fromEntries(f);for(let el of ev.target.querySelectorAll('input[type=checkbox]'))o[el.name]=el.checked;convert(o);try{await request(path,{method:'POST',body:JSON.stringify(o)});msg('Đã lưu');ev.target.reset();await load()}catch(e){msg('Lỗi: '+e.message)}})}
attach('periodForm','/periods',o=>{o.minCredits=Number(o.minCredits);o.maxCredits=Number(o.maxCredits);o.targetConfig=null});
attach('registerForm','/registrations',o=>{o.registrationType=Number(o.registrationType);o.replacedGradeId=null});
attach('equivForm','/equivalences',o=>{o.equivalenceType=Number(o.equivalenceType);o.effectDate=o.effectDate||null});load();
</script></body></html>
