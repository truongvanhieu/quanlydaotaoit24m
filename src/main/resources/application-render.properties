spring.application.name=quanlydaotao

# Cấu hình chạy trên Render (Free Cloud)
# Mặc định sử dụng H2 file database tự khởi tạo để web luôn hoạt động ngay lập tức
# Khi bạn gắn PostgreSQL trên Render, chỉ cần thêm biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/it24m;DB_CLOSE_DELAY=-1;MODE=MSSQLServer}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cổng Render cấp phát tự động
server.port=${PORT:8080}
